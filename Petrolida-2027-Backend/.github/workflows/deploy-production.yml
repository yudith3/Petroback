name: Deploy backend production

on:
  push:
    branches: [prod]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: petrolida-backend-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Validate source
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
          go test ./...
      - name: Build release image
        run: |
          set -euo pipefail
          docker build --pull -t "petrolida/backend:${GITHUB_SHA}" .
          docker save "petrolida/backend:${GITHUB_SHA}" | gzip -1 > "${RUNNER_TEMP}/backend.tar.gz"
      - name: Verify master-data cache
        run: python3 deploy/tests/verify_cache.py
      - name: Configure SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ vars.VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Upload and activate release
        env:
          VPS_HOST: ${{ vars.VPS_HOST }}
        run: |
          set -euo pipefail
          # Deploy berjalan lama dan sebagian besar waktunya senyap, terutama saat
          # pg_dump dan saat menunggu health check. Tanpa keepalive, perangkat NAT
          # di antara runner dan VPS memutus koneksi yang menganggur, lalu ssh
          # gagal dengan "client_loop: send disconnect: Broken pipe" exit 255
          # walaupun deploy di server sebenarnya masih berjalan normal.
          ssh_options=(
            -o BatchMode=yes
            -o ServerAliveInterval=20
            -o ServerAliveCountMax=30
            -o TCPKeepAlive=yes
          )
          scp "${ssh_options[@]}" "${RUNNER_TEMP}/backend.tar.gz" "deploy@${VPS_HOST}:/srv/petrolida/incoming/backend-${GITHUB_SHA}.tar.gz"
          scp "${ssh_options[@]}" deploy/compose.prod.yaml deploy/Caddyfile deploy/nginx-cache.conf deploy/deploy.sh deploy/backup.sh "deploy@${VPS_HOST}:/srv/petrolida/"
          # The release SHA is intentionally expanded by the runner.
          # shellcheck disable=SC2029
          ssh "${ssh_options[@]}" "deploy@${VPS_HOST}" "chmod 700 /srv/petrolida/deploy.sh /srv/petrolida/backup.sh && /srv/petrolida/deploy.sh backend ${GITHUB_SHA}"
