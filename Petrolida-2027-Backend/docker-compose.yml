name: petrolida-2027

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-petrolida_2027}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_PORT:-54327}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    profiles: ["full"]
    build:
      context: .
    restart: unless-stopped
    environment:
      APP_NAME: petrolida-2027-api
      APP_HOST: 0.0.0.0
      APP_PORT: 8998
      ENVIRONMENT: development
      LOG_LEVEL: debug
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      REQUEST_BODY_LIMIT_BYTES: 12582912
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASS: ${POSTGRES_PASSWORD:-postgres}
      DB_NAME: ${POSTGRES_DB:-petrolida_2027}
      DB_SSL_MODE: disable
      DB_TIMEZONE: Asia/Jakarta
      JWT_SECRET: ${JWT_SECRET:-development-only-change-me}
      AUTH_SESSION_TTL: ${AUTH_SESSION_TTL:-8h}
      ADMIN_NAME: ${ADMIN_NAME:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      OPREC_REGISTRATION_START_AT: ${OPREC_REGISTRATION_START_AT:-}
      OPREC_REGISTRATION_END_AT: ${OPREC_REGISTRATION_END_AT:-}
      OPREC_INTERVIEW_ANNOUNCEMENT_AT: ${OPREC_INTERVIEW_ANNOUNCEMENT_AT:-2026-10-08T10:00:00+07:00}
      OPREC_ALLOWED_BATCHES: ${OPREC_ALLOWED_BATCHES:-2024,2025,2026}
      OPREC_PORTFOLIO_MAX_BYTES: ${OPREC_PORTFOLIO_MAX_BYTES:-10485760}
      PORTFOLIO_STORAGE_DIR: /data/portfolios
    ports:
      - "8998:8998"
    volumes:
      - portfolio_data:/data/portfolios
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  portfolio_data:
