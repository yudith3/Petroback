name: petrolida-prod

x-logging: &default-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  db-tools:
    image: postgres:17-alpine
    profiles: ["ops"]
    environment:
      PGHOST: ${DB_HOST:?DB_HOST is required}
      PGPORT: ${DB_PORT:-5432}
      PGUSER: ${DB_USER:?DB_USER is required}
      PGPASSWORD: ${DB_PASS:?DB_PASS is required}
      PGDATABASE: ${DB_NAME:-postgres}
      PGSSLMODE: ${DB_SSL_MODE:-require}

  backend:
    image: petrolida/backend:${BACKEND_TAG:?BACKEND_TAG is required}
    restart: unless-stopped
    environment:
      APP_NAME: petrolida-2027-api
      APP_HOST: 0.0.0.0
      APP_PORT: 8998
      ENVIRONMENT: production
      LOG_LEVEL: info
      CORS_ALLOWED_ORIGINS: ${SITE_ORIGIN:?SITE_ORIGIN is required}
      APP_PUBLIC_URL: ${SITE_ORIGIN:?SITE_ORIGIN is required}
      REQUEST_BODY_LIMIT_BYTES: 12582912
      DB_HOST: ${DB_HOST:?DB_HOST is required}
      DB_PORT: ${DB_PORT:-5432}
      DB_USER: ${DB_USER:?DB_USER is required}
      DB_PASS: ${DB_PASS:?DB_PASS is required}
      DB_NAME: ${DB_NAME:-postgres}
      DB_SSL_MODE: ${DB_SSL_MODE:-require}
      DB_TIMEZONE: Asia/Jakarta
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      AUTH_SESSION_TTL: ${AUTH_SESSION_TTL:-8h}
      PETRORUN_BASE_PRICE_IDR: ${PETRORUN_BASE_PRICE_IDR:-}
      PETRORUN_ADMIN_FEE_IDR: ${PETRORUN_ADMIN_FEE_IDR:-}
      PETRORUN_JERSEY_SURCHARGE_2XL_IDR: ${PETRORUN_JERSEY_SURCHARGE_2XL_IDR:-}
      PETRORUN_JERSEY_SURCHARGE_3XL_IDR: ${PETRORUN_JERSEY_SURCHARGE_3XL_IDR:-}
      PETRORUN_JERSEY_SURCHARGE_4XL_IDR: ${PETRORUN_JERSEY_SURCHARGE_4XL_IDR:-}
      PETRORUN_BANK_NAME: ${PETRORUN_BANK_NAME:-}
      PETRORUN_BANK_ACCOUNT_NUMBER: ${PETRORUN_BANK_ACCOUNT_NUMBER:-}
      PETRORUN_BANK_ACCOUNT_HOLDER: ${PETRORUN_BANK_ACCOUNT_HOLDER:-}
      PETRORUN_ACCESS_SECRET: ${PETRORUN_ACCESS_SECRET:-}
      PETRORUN_EARLY_BIRD_PRICE_IDR: ${PETRORUN_EARLY_BIRD_PRICE_IDR:-}
      PETRORUN_EARLY_BIRD_QUOTA: ${PETRORUN_EARLY_BIRD_QUOTA:-}
      PETRORUN_LATE_PRICE_IDR: ${PETRORUN_LATE_PRICE_IDR:-}
      PETRORUN_REGISTRATION_START_AT: ${PETRORUN_REGISTRATION_START_AT:-}
      PETRORUN_REGISTRATION_END_AT: ${PETRORUN_REGISTRATION_END_AT:-}
      PETRORUN_LATE_START_AT: ${PETRORUN_LATE_START_AT:-}
      PETRORUN_RACEPACK_AT: ${PETRORUN_RACEPACK_AT:-}
      ADMIN_NAME: ${ADMIN_NAME:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_INSTITUTION: ${ADMIN_INSTITUTION:-PETROLIDA 2027}
      ADMIN_PHONE: ${ADMIN_PHONE:-}
      OPREC_REGISTRATION_START_AT: ${OPREC_REGISTRATION_START_AT:?OPREC_REGISTRATION_START_AT is required}
      OPREC_REGISTRATION_END_AT: ${OPREC_REGISTRATION_END_AT:?OPREC_REGISTRATION_END_AT is required}
      OPREC_ANNOUNCEMENT_AT: ${OPREC_ANNOUNCEMENT_AT:-}
      OPREC_INTERVIEW_ANNOUNCEMENT_AT: ${OPREC_INTERVIEW_ANNOUNCEMENT_AT:-2026-10-08T10:00:00+07:00}
      OPREC_STAFF_GROUP_URL: ${OPREC_STAFF_GROUP_URL:-}
      OPREC_INTERVIEW_SCHEDULE_URL: ${OPREC_INTERVIEW_SCHEDULE_URL:-}
      OPREC_ALLOWED_BATCHES: ${OPREC_ALLOWED_BATCHES:-2024,2025,2026}
      OPREC_PORTFOLIO_MAX_BYTES: ${OPREC_PORTFOLIO_MAX_BYTES:-10485760}
      PORTFOLIO_STORAGE_DIR: /data/portfolios
      # Default local supaya perilakunya tidak berubah sampai nilai Drive benar
      # benar diisi di server. Begitu driver diisi gdrive, backend menolak menyala
      # kalau ada satu saja dari empat nilai di bawah yang kosong.
      PORTFOLIO_STORAGE_DRIVER: ${PORTFOLIO_STORAGE_DRIVER:-local}
      GDRIVE_CLIENT_ID: ${GDRIVE_CLIENT_ID:-}
      GDRIVE_CLIENT_SECRET: ${GDRIVE_CLIENT_SECRET:-}
      GDRIVE_REFRESH_TOKEN: ${GDRIVE_REFRESH_TOKEN:-}
      GDRIVE_FOLDER_ID: ${GDRIVE_FOLDER_ID:-}
      GDRIVE_TIMEOUT: ${GDRIVE_TIMEOUT:-1m}
    ports:
      - "127.0.0.1:18998:8998"
    volumes:
      - portfolio_data:/data/portfolios
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

  frontend:
    image: petrolida/frontend:${FRONTEND_TAG:?FRONTEND_TAG is required}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: 3000
    ports:
      - "127.0.0.1:13000:3000"
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

  nginx-cache:
    image: nginx:stable-alpine
    restart: unless-stopped
    expose:
      - "8080"
    volumes:
      - ./nginx-cache.conf:/etc/nginx/conf.d/default.conf:ro
      - nginx_cache:/var/cache/nginx
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 3
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      nginx-cache:
        condition: service_healthy
    networks:
      - default
      - staging-edge
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?SITE_ADDRESS is required}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./staging:/etc/caddy/staging:ro
      - caddy_data:/data
      - caddy_config:/config
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

volumes:
  portfolio_data:
  nginx_cache:
  caddy_data:
  caddy_config:

networks:
  staging-edge:
    external: true
    name: petrolida-staging-edge
