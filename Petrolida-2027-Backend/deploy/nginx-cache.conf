# Loaded inside the stock nginx image's http context.
proxy_cache_path /var/cache/nginx/master-data levels=1:2
    keys_zone=master_data:10m max_size=100m inactive=30m use_temp_path=off;

# Only anonymous GET/HEAD requests may read or populate the shared cache.
map "$request_method:$http_authorization:$http_cookie" $skip_master_cache {
    default 1;
    ~^(GET|HEAD)::$ 0;
}

map $upstream_status $uncacheable_status {
    default 1;
    200 0;
}

map $http_x_request_id $master_request_id {
    default $http_x_request_id;
    "" $request_id;
}

log_format master_cache '$remote_addr $request_method $uri status=$status '
    'cache=$upstream_cache_status request_time=$request_time '
    'upstream_time=$upstream_response_time request_id=$master_request_id';

server {
    listen 8080;
    server_name _;
    server_tokens off;
    access_log /dev/stdout master_cache;

    # Resolve Docker service addresses again after backend recreation.
    resolver 127.0.0.11 valid=5s ipv6=off;
    set $backend_origin http://backend:8998;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_set_header X-Request-ID $master_request_id;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;

    # A cache HIT still receives its own request ID.
    proxy_hide_header X-Request-ID;
    add_header X-Request-ID $master_request_id always;
    add_header X-Cache-Status $upstream_cache_status always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Explicitly allow only the existing public master-data list routes.
    location ~ ^/api/v1/master/(division|division/sub|department|faculty|divisions|subdivisions|departments|faculties)$ {
        proxy_pass $backend_origin;
        proxy_cache master_data;
        proxy_cache_key "$host$request_uri|origin=$http_origin";
        proxy_cache_methods GET HEAD;
        proxy_cache_valid 200 15m;
        proxy_cache_bypass $skip_master_cache;
        proxy_no_cache $skip_master_cache $uncacheable_status;
        proxy_cache_lock on;
        proxy_cache_lock_timeout 5s;
        # Keep the defaults that honor Cache-Control, Set-Cookie and Vary.
        # Do not serve stale master data after expiry or backend failures.
    }

    # Detail routes, unknown paths and other API routes never enter the cache.
    location / {
        proxy_pass $backend_origin;
        proxy_cache off;
    }
}
